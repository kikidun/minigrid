services:
  worker:
    #build the image from the dockerfile
    build: .
    image: minigrid
    command: ["python", "worker.py"]
    environment:
      API_URL: ${COORDINATOR_URL:?COORDINATOR_URL is not set}
      NODE_NAME: ${NODE_NAME:?NODE_NAME is not set}
    restart: unless-stopped
    deploy: 
      replicas: 2