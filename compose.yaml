x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db-init:
    #build the image from the dockerfile
    build: .
    image: minigrid
    command: ["python", "init_db.py"]
    environment:
      DB_PATH: /data/grid.db
    volumes:
     - griddata:/data
    logging: *default-logging
     
  coordinator:
    #build the image from the dockerfile
    build: .
    image: minigrid
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--worker-class", "gthread", "--threads", "4", "app:app"]
    environment:
      DB_PATH: /data/grid.db
    depends_on:
      db-init:
        condition: "service_completed_successfully"
    volumes:
     - griddata:/data
    ports: 
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  sweeper:
    #build the image from the dockerfile
    build: .
    image: minigrid
    command: ["python", "sweeper.py"]
    environment:
      DB_PATH: /data/grid.db
      API_URL: "http://coordinator:5000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      coordinator:
        condition: service_healthy
    volumes:
    - griddata:/data
    restart: unless-stopped
    logging: *default-logging

  worker:
    #build the image from the dockerfile
    build: .
    image: minigrid
    command: ["python", "worker.py"]
    environment:
      API_URL: "http://coordinator:5000"
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    profiles: ["local"]
volumes:
  griddata: